function srand(a, b) {               // Scratch "pick random": whole numbers if both ends are whole
  const lo = Math.min(a, b), hi = Math.max(a, b);
  if (Number.isInteger(a) && Number.isInteger(b)) return lo + Math.floor(Math.random() * (hi - lo + 1));
  return lo + Math.random() * (hi - lo);
}
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

const SAVE_KEY = 'spacegunner_save_v1';
let SAVE = null;
function defaultSave() {
  return { v: 2, quality: 'auto', difficulty: 3, variant: 1, credits: 0, best: {}, bestWave: {}, daily: { date: '', best: 0 }, volume: 0.7, muted: false, music: true,
    owned: { 1: true }, shop: {}, ach: {}, stats: { kills: 0, runs: 0, bosses: 0, bossTypes: {}, creditsEarned: 0, time: 0 } };
}
function loadSave() {
  SAVE = defaultSave();
  let s = null;
  try { s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) {}
  if (s && typeof s === 'object') {
    if (!s.v) {
      // version 1: credits were a running total and cannons unlocked at 600 / 2000 / 5000
      SAVE.credits = Math.max(0, s.credits | 0);
      SAVE.best = s.best && typeof s.best === 'object' ? s.best : {};
      SAVE.difficulty = s.difficulty; SAVE.variant = s.variant;
      if (s.sound === false) SAVE.muted = true;
      for (let v = 2; v <= 4; v++) if (SAVE.credits >= [0, 0, 600, 2000, 5000][v]) SAVE.owned[v] = true;
      SAVE.stats.creditsEarned = SAVE.credits;
    } else {
      for (const k in SAVE) if (k in s) SAVE[k] = (typeof SAVE[k] === 'object' && SAVE[k] && !Array.isArray(SAVE[k])) ? Object.assign(SAVE[k], s[k]) : s[k];
    }
  }
  const num = (v, d = 0) => (typeof v === 'number' && isFinite(v) && v >= 0) ? v : d;
  const obj = v => (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
  SAVE.credits = Math.floor(num(SAVE.credits));
  for (const k of ['best', 'bestWave', 'owned', 'shop', 'ach']) SAVE[k] = obj(SAVE[k]);
  SAVE.stats = Object.assign(defaultSave().stats, obj(SAVE.stats));
  for (const k of ['kills', 'runs', 'bosses', 'creditsEarned', 'time']) SAVE.stats[k] = num(SAVE.stats[k]);
  SAVE.stats.bossTypes = obj(SAVE.stats.bossTypes);
  if (!SAVE.daily || typeof SAVE.daily !== 'object' || typeof SAVE.daily.date !== 'string') SAVE.daily = { date: '', best: 0 };
  SAVE.daily.best = num(SAVE.daily.best);
  for (const it of SHOP) SAVE.shop[it.id] = clamp(num(SAVE.shop[it.id]) | 0, 0, it.max);
  for (const k in SAVE.best) SAVE.best[k] = num(SAVE.best[k]);
  SAVE.music = SAVE.music !== false; SAVE.muted = SAVE.muted === true;
  if (!['auto', 'high', 'low'].includes(SAVE.quality)) SAVE.quality = 'auto';
  Q.low = SAVE.quality === 'low';
  SAVE.difficulty = clamp(SAVE.difficulty | 0 || 3, 1, 10);
  SAVE.variant = clamp(SAVE.variant | 0 || 1, 1, 4);
  SAVE.volume = clamp(+SAVE.volume || 0, 0, 1);
  SAVE.owned[1] = true;
  if (!SAVE.owned[SAVE.variant]) SAVE.variant = 1;
}

const AU = { ctx: null, master: null, sfx: null, mus: null, delay: null, noise: null, pop: null, last: {} };

function initAudio() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    const c = new AC(); AU.ctx = c;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    comp.connect(c.destination);
    AU.master = c.createGain(); AU.master.connect(comp);
    AU.sfx = c.createGain(); AU.sfx.connect(AU.master);
    AU.mus = c.createGain(); AU.mus.connect(AU.master);
    // echo for the music arpeggio (that "spacey" feel)
    AU.delay = c.createDelay(1); AU.delay.delayTime.value = 0.28;
    const fb = c.createGain(); fb.gain.value = 0.38;
    const dl = c.createBiquadFilter(); dl.type = 'lowpass'; dl.frequency.value = 2400;
    AU.delay.connect(dl); dl.connect(fb); fb.connect(AU.delay); dl.connect(AU.mus);
    // one second of white noise, reused for hats, snares and explosions
    const nb = c.createBuffer(1, c.sampleRate, c.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    AU.noise = nb;
    const bin = atob(POP_B64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    c.decodeAudioData(arr.buffer, b => { AU.pop = b; }, () => {});
    applyVolume();
    MUSIC.next = c.currentTime + 0.1;
  } catch (e) { AU.ctx = null; }
}
function applyVolume() {
  if (!AU.ctx) return;
  AU.master.gain.value = SAVE.muted ? 0 : SAVE.volume;
  AU.mus.gain.value = SAVE.music ? 0.5 : 0;
}
function gate(tag, gap) {           // stops the same sound from stacking up 50 times in one frame

  game: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]],                   // Am F C G

  while (MUSIC.next < c.currentTime + 0.15) {

function killSize(D) { return 50 - D * 2; }                                  // his pop size

    speed: T.enemySpeed * et.speed * SPD() * (1 + T.hSpeed * hard(g)) * (mod(g, 'fast') ? 1.25 : 1) * srand(0.9, 1.1),

    const y0 = clamp(srand(-140, 140.0), -140, 140);
    for (let i = 0; i < 5; i++) { const off = Math.abs(i - 2); makeEnemy(g, 'swarm', WW / 2 + 10 + off * 14, y0 + (i - 2) * 13, size * srand(0.9, 1.1)); }
    return;
  }
  const giantRoll = () => srand(D * 2, 100) === 100 || (mod(g, 'giants') && [0, 1, 2].some(() => srand(D * 2, 100) === 100));
  if (type === 'square' && giantRoll()) {          // his giant rolls
    size += srand(50, 300);
    if (srand(D * 5, 150) === 150) {

      if (srand(D * 10, 200) === 200) size += srand(500, 2000);

  makeEnemy(g, type, sx, clamp(y, -165, 165), size);

    g.bullets.push({ x: cx + 22, y: g.y, px: cx + 22, vx: 900 * sp, vy: 0, kind: 'piercer', size: 60, hits: new Set(), pierceLeft: Infinity, life: 0 });

    return Math.max(0.25, T.piercerTime * g.attackSpeed / 0.5 * (1 - 0.08 * lv('piercore')));
  }
  const n = v.shots + g.multi + g.extraShots, gap = v.shots === 3 ? 5 : 4;
  for (let i = 0; i < n; i++) {
    const a = (i - (n - 1) / 2) * gap, r = a * Math.PI / 180;
    g.bullets.push({ x: cx + 20, y: g.y + a * 0.55, px: cx + 20, vx: Math.cos(r) * T.bulletSpeed * sp, vy: Math.sin(r) * T.bulletSpeed * sp,
      kind: 'normal', size: srand(45, 55) * v.bullet, hits: new Set(), pierceLeft: g.pierce, life: 0 });
  }
  SFX.shoot(g.variant, false);

}

function addTrauma(g, a) { g.trauma = Math.min(1, g.trauma + a); }

function damagePopup(g, e, d) {
  if (e.pop && e.pop.t > 0.5) { e.pop.val += d; e.pop.t = 0.75; e.pop.x = e.x; e.pop.y = e.y + half(e) + 4; return; }
  e.pop = { x: e.x, y: e.y + half(e) + 4, val: d, t: 0.75, col: '#ffffff', small: true };
  g.popups.push(e.pop);
}

function phasedOut(e) { return (e.type === 'ghost' && e.phase % 3.5 > 2.2) || (e.boss && e.phased > 0); }
function hurtEnemy(g, e, dmg, src) {
  if (e.dead) return;

  let d = dmg;
  if ((src === 'bullet' || src === 'pierce') && Math.random() < g.crit) {
    d *= 2; g.crits++; if (g.crits >= 100) unlock('crit100');
    g.popups.push({ x: e.x, y: e.y + half(e) + 12, val: 'CRIT', t: 0.6, col: '#fff100' });
  }
  if (e.boss) d *= T.bossRes;
  else if (e.armor < 1) { if (src === 'bullet') d *= e.armor; else if (src === 'splash') d *= (1 + e.armor) / 2; }
  e.size -= d;
  e.flash = 0.08;
  damagePopup(g, e, d);
  if (e.armor < 1 && src === 'bullet') {
    for (let i = 0; i < 3; i++) g.parts.push({ k: 'spark', x: e.x - half(e), y: e.y + rnd(-half(e), half(e)), vx: rnd(-160, -40), vy: rnd(-90, 90), life: 0.2, max: 0.2, col: '#e8f4ff' });
  }
  if (src === 'bullet' || src === 'pierce') SFX.hit(e.armor < 1);
  if (e.boss && e.boss.kind === 'king') {
    const frac = (e.size - e.killAt) / (e.max - e.killAt);
    if ((e.sheds === 0 && frac < 0.66) || (e.sheds === 1 && frac < 0.33)) {
      e.sheds++;
      for (const s of [-1, 1]) { const c = makeEnemy(g, 'splitter', e.x - half(e) * 0.6, e.y + s * half(e) * 0.7, 130 * growth(g.t)); c.vy = s * 50; }
      addTrauma(g, 0.25);
    }
  }
  if (e.size < (e.boss ? e.killAt : killSize(g.D))) killEnemy(g, e, src);
}

function enemyColor(e) {
  if (e.boss) return e.boss.col;
  return { square: SQ_COLORS[e.c - 1], dasher: '#ffffff', splitter: '#fff100', armored: '#b8c0cc', shooter: '#ff2a2a', swarm: '#ff5a1f', ghost: '#d9c2ff', healer: '#35ff00' }[e.type];
}

const SPARKCOL = {};
const sparkCol = col => SPARKCOL[col] || (SPARKCOL[col] = shade(col, 0.5));   // was built again for every spark
function burst(g, x, y, col, n, power, big) {
  if (Q.low) n = Math.ceil(n * 0.5);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = rnd(40, 170) * power;
    g.parts.push(newPart({ k: 'shard', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, rot: rnd(0, TAU), vr: rnd(-12, 12), sz: rnd(2, 5.5) * (big ? 1.6 : 1), life: rnd(0.35, 0.8), max: 0.8, col }));
  }
  for (let i = 0; i < n * 0.6; i++) {
    const a = Math.random() * TAU, s = rnd(120, 340) * power;
    g.parts.push(newPart({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.12, 0.3), max: 0.3, col: sparkCol(col) }));
  }
  g.rings.push({ x, y, r: 4, vr: 160 * power, life: 0.35, max: 0.35, col, lw: 3 * power });
}

function chainZap(g, from, dmg) {
  let best = null, bd = 60;
  for (const o of g.enemies) { if (o === from || o.dead) continue; const d = Math.hypot(o.x - from.x, o.y - from.y); if (d < bd) { bd = d; best = o; } }
  if (!best) return;
  g.parts.push({ k: 'bolt', x: from.x, y: from.y, x2: best.x, y2: best.y, life: 0.12, max: 0.12, col: '#bfa8ff', vx: 0, vy: 0 });
  hurtEnemy(g, best, dmg * 0.4, 'chain');
}
function dropCoin(g, x, y, val) {
  if (g.coins.length >= CAP().coins) {          // too many coins: add the gold to the closest one instead (same gold, fewer coins)
    let best = g.coins[0], bd = Infinity;
    for (const c of g.coins) { const d = (c.x - x) ** 2 + (c.y - y) ** 2; if (d < bd) { bd = d; best = c; } }
    best.val += val; return;
  }
  g.coins.push({ x, y: clamp(y, -145, 140), vx: rnd(-20, 30), vy: rnd(-30, 30), val, t: 0 });
}

function killEnemy(g, e, src) {
  e.dead = true;
  g.kills++;
  g.gold += e.gold * g.goldMul;
  SAVE.stats.kills++;
  const col = enemyColor(e), h = half(e);
  const big = e.boss || e.max >= 250;
  burst(g, e.x, e.y, col, Math.min(40, 10 + (h / 2) | 0), 0.7 + Math.min(2, h / 40), big);
  g.popups.push({ x: e.x, y: e.y + 6, val: Math.floor(e.gold * g.goldMul) || 1, t: 0.9, col: '#ffd43b', gold: true });
  if (src === 'beam') g.beam.kills++;
  if (src === 'shock') g.shock.kills++;
  if (e.type === 'ghost' && ++g.ghostKills >= 25) unlock('ghost25');
  if (e.type === 'healer' && ++g.healerKills >= 10) unlock('healer10');
  if (e.boss) for (let i = 0; i < 8; i++) dropCoin(g, e.x + rnd(-h, h) * 0.6, e.y + rnd(-h, h) * 0.6, 3);
  else if (Math.random() < 0.16) dropCoin(g, e.x, e.y, 3);
  if (e.boss) {
    SFX.bigPop(); g.freeze = 0.28; addTrauma(g, 0.9); g.flash = 0.5;
    for (let i = 0; i < 3; i++) setTimeoutSafe(() => { if (G === g) burst(g, e.x + rnd(-h, h), e.y + rnd(-h, h), col, 20, 1.6, true); }, 120 * i);
    g.bossesKilled++; SAVE.stats.bosses++; SAVE.stats.bossTypes[e.boss.kind] = true;
    g.bossFade = { name: e.boss.name, col: e.boss.col, t: 0.8 };
    g.boss = null; g.nextBoss = g.t + bossGap(g); setMusic('game');
    giveCard(g); giveCard(g);
    unlock('boss1'); if (Object.keys(SAVE.stats.bossTypes).length >= 3) unlock('boss3'); if (Object.keys(SAVE.stats.bossTypes).length >= 5) unlock('boss5');
    if (e.boss.kind === 'king') for (let i = 0; i < 4; i++) { const c = makeEnemy(g, 'splitter', e.x + rnd(-20, 20), e.y + (i - 1.5) * 30, 110 * growth(g.t)); c.vy = (i - 1.5) * 40; }
  } else {
    SFX.pop(e.max);
    if (big) { g.freeze = Math.max(g.freeze, 0.06); addTrauma(g, 0.35); unlock('giant'); }
    else addTrauma(g, 0.06);
    if (e.type === 'splitter' && e.max * 0.55 > killSize(g.D) + 12) {
      for (const s of [-1, 1]) { const c = makeEnemy(g, 'square', e.x, e.y + s * h * 0.5, e.max * 0.55); c.c = s < 0 ? 1 : 2; c.vy = s * 70; }
    }
  }
  unlock('first');
  if (g.beam.kills >= 10) unlock('beam10');
  if (g.shock.kills >= 5) unlock('ring5');
  if (g.gold >= 500) unlock('gold500');
  // "Upgrade" broadcast: kills fill the Experience bar, a full bar = an upgrade card
  g.xp++;
  if (g.xp >= xpNeed(g)) { g.xp -= xpNeed(g); g.level++; g.xpFull = 0.35; giveCard(g); }
}

function cardOk(g, t) {
  switch (t) {
    case 1: return g.attackSpeed > T.minSpeed + 0.001;
    case 4: return !g.splash && !VARIANTS[g.variant].splash;
    case 5: return g.pierce < 2;
    case 6: return g.multi < 1;
    case 7: return g.beamBonus < 3;
    case 8: return g.shield < g.shieldMax;
    case 9: return g.goldCards < 3;
    case 10: return g.shockCards < 3;
    case 11: return g.critCards < 3;
    case 14: return g.overdrive < 2 && g.beam.st !== 'off';
    case 15: return g.shieldMax < 5;
    case 16: return !g.chain;
    case 17: return g.slow >= 1;
    case 18: return !g.golden;
    case 7: return g.beamBonus < 3 && g.beam.st !== 'off';
    default: return true;
  }
}
function rollRarity(g, minR) {
  const luck = lv('lucky') + (mod(g, 'lucky') ? 5 : 0);
  const r = Math.random();
  if (minR >= 1) return r < 0.15 + 0.02 * luck ? 2 : 1;
  if (r < 0.02 + 0.005 * luck) return 2;
  if (r < 0.1 + 0.02 * luck) return 1;
  return 0;
}
function giveCard(g, quiet, minR = 0) {
  let total = 0, pool = [];
  for (let rar = rollRarity(g, minR); rar >= 0 && !pool.length; rar--) {
    for (let t = 1; t < CARDS.length; t++) if (CARDS[t].r === rar && cardOk(g, t)) { pool.push(t); total += CARDS[t].w; }
  }
  if (!pool.length) { pool = [3]; total = 1; }
  let r = Math.random() * total, type = pool[0];
  for (const t of pool) { if ((r -= CARDS[t].w) <= 0) { type = t; break; } }
  // effects of his four cards copied from Sprite19
  if (type === 1) g.attackSpeed = Math.max(T.minSpeed, Math.round((g.attackSpeed - 0.1) * 100) / 100);
  if (type === 2) g.attackDamage += 1;
  if (type === 3) g.health += 10;
  if (type === 4) g.splash = 1;
  if (type === 5) g.pierce++;
  if (type === 6) g.multi++;
  if (type === 7) g.beamBonus++;
  if (type === 8) g.shield++;
  if (type === 9) { g.goldCards++; g.goldMul += 0.25; }
  if (type === 10) { g.shockCards++; g.shockPow += 0.5; }
  if (type === 11) { g.critCards++; g.crit += 0.06; }
  if (type === 12) g.attackDamage += 2;
  if (type === 13) g.health = Math.max(g.health, g.startHealth);
  if (type === 14) { g.overdrive++; g.beamExtra += 0.5; }
  if (type === 15) { g.shieldMax = 5; g.shield = Math.min(5, g.shield + 2); }
  if (type === 16) g.chain = 1;
  if (type === 17) g.slow = 0.85;
  if (type === 18) { g.golden = 1; g.goldMul *= 2; }
  if (CARDS[type].r === 2) { g.legends++; unlock('legend'); }
  g.cardsGot++;
  if (g.cardsGot >= 10) unlock('cards10');
  if (quiet) return;
  g.cards.push({ type, x: rnd(-WW / 2 + 100, WW / 2 - 70), y: rnd(-90, 80), t: 0 });
  SFX.card();
  if (CARDS[type].r) SFX.rare(CARDS[type].r);
}

function beamGeom() { const s = SPD(); return { x0: 30, x1: 30 + 328.5 * s, h0: 15, h1: 133 }; }
function beamHits(g, e) {
  // wedge from SpaceShooter's beam costume: narrow at the gun, wide far away
  const B = beamGeom(), dx = e.x - cannonX(), dy = e.y - g.y, h = half(e);
  if (dx + h < B.x0 || dx - h > B.x1) return false;
  const k = (clamp(dx, B.x0, B.x1) - B.x0) / (B.x1 - B.x0);
  return Math.abs(dy) <= lerp(B.h0, B.h1, k) + h;
}
function shockRadius(g) { return lerp(81, 105, clamp(1 - g.shock.t / T.shockOn, 0, 1)) * (1 + 0.08 * lv('shockamp')); }   // his 140%..180% ring, x1.6

function hurtCannon(g, dmg, x, y) {
  if (g.shield > 0) {
    g.shield--; SFX.shield();
    g.rings.push({ x: cannonX() + 10, y: g.y, r: 10, vr: 140, life: 0.35, max: 0.35, col: '#63e2ff', lw: 4 });
    g.popups.push({ x: cannonX() + 30, y: g.y + 14, val: 'BLOCKED', t: 0.8, col: '#63e2ff' });
    return;
  }
  dmg *= armorMul();
  g.health -= dmg; g.damageTaken += dmg;
  g.hurt = 0.4; g.freeze = Math.max(g.freeze, 0.05);
  addTrauma(g, Math.min(0.7, 0.25 + dmg / 50));
  g.popups.push({ x: cannonX() + 36, y: y, val: '-' + Math.ceil(dmg), t: 0.9, col: '#ff4d5e' });
  SFX.leak();
}

function stepGame(dt) {
  const g = G;
  if (g.freeze > 0) { g.freeze -= dt; stepFx(g, dt * 0.15); return; }      // hit-stop
  if (g.dead) {
    g.dead += dt; stepFx(g, dt);
    if (g.dead > 1.8 && scene === 'play') go(() => { scene = 'over'; ui.sel = 0; setMusic('off'); });
    return;
  }
  g.t += dt;
  const v = VARIANTS[g.variant], cx = cannonX();

  // --- cannon: w/a up, s/d down (his keys) + arrows, with a little easing ---
  const up = key('w') || key('a') || key('arrowup'), down = key('s') || key('d') || key('arrowdown');
  const target = (up ? 1 : 0) - (down ? 1 : 0);
  g.vy = lerp(g.vy, target * v.move * 30, 1 - Math.pow(0.0001, dt));
  g.y = clamp(g.y + g.vy * dt, -166, 166);

  // --- E: shoot ---
  g.fireCd -= dt; g.recoil = Math.max(0, g.recoil - dt); g.muzzle = Math.max(0, g.muzzle - dt);
  if ((key('e') || key(' ')) && g.fireCd <= 0) {
    const period = fire(g);
    g.fireCd = period; g.recoil = Math.min(0.12, period / 2);
  }

  // --- T: switch ammo (SpaceShooter's sniper bullet) ---
  g.ammoCd -= dt;
  if (key('t') && g.ammoCd <= 0) { g.ammo = g.ammo === 'normal' ? 'piercer' : 'normal'; g.ammoCd = 0.5; g.fireCd = Math.min(g.fireCd, 0.15); SFX.swap(); }

  // --- R: MEGA BEAM (hold 1 s, charge 1 s, fire 1 s, recharge) ---
  const b = g.beam;
  if (b.st === 'idle') {
    if (key('r')) { b.hold += dt; if (b.hold >= T.beamHold) { b.st = 'charge'; b.t = T.beamCharge; SFX.beamCharge(); } }
    else b.hold = 0;
  } else if (b.st === 'charge') {
    b.t -= dt; addTrauma(g, dt * 0.25);
    if (Math.random() < 0.8) { const a = rnd(0, TAU), r = rnd(30, 60); g.parts.push({ k: 'suck', x: cx + 30 + Math.cos(a) * r, y: g.y + Math.sin(a) * r, tx: cx + 30, ty: g.y, life: 0.3, max: 0.3, col: '#00fffa' }); }
    if (b.t <= 0) { b.st = 'fire'; b.t = T.beamFire + g.beamExtra; b.tick = 0; b.kills = 0; addTrauma(g, 0.5); SFX.beamFire(); g.flash = 0.25; }
  } else if (b.st === 'fire') {
    b.t -= dt; b.tick -= dt; addTrauma(g, dt * 1.2);
    if (b.tick <= 0) {
      b.tick += 1 / 30;
      const dmg = hitDamage(g) * T.beamDmg;
      for (const e of g.enemies) if (!e.dead && beamHits(g, e)) {
        hurtEnemy(g, e, dmg, 'beam');
        if (Math.random() < 0.3) g.parts.push({ k: 'spark', x: e.x - half(e), y: e.y + rnd(-half(e), half(e)), vx: rnd(40, 200), vy: rnd(-120, 120), life: 0.25, max: 0.25, col: '#bffcff' });
      }
      g.ebullets = g.ebullets.filter(eb => !(eb.x - cx > 30 && Math.abs(eb.y - g.y) < 15 + (eb.x - cx) * 0.36));
    }
    if (b.t <= 0) { b.st = 'cool'; b.t = b.coolMax = beamCool(g); }
  } else if (b.st === 'cool') {
    b.t -= dt;
    if (b.t <= 0) { b.st = 'idle'; b.hold = 0; }
  }

  // --- F: shockwave ring (SpaceShooter): 2 s on, 4 s off ---
  const s = g.shock;
  if (s.st === 'idle' && key('f')) { s.st = 'on'; s.t = T.shockOn; s.tick = 0; s.kills = 0; SFX.shock(); addTrauma(g, 0.3); }
  else if (s.st === 'on') {
    s.t -= dt; s.tick -= dt;
    if (s.tick <= 0) {
      s.tick += 1 / 30;
      const r = shockRadius(g), ox = cx, oy = g.y;
      for (const e of g.enemies) {
        if (e.dead) continue;
        const h = half(e);
        const nx = clamp(ox, e.x - h, e.x + h), ny = clamp(oy, e.y - h, e.y + h);
        const near = Math.hypot(nx - ox, ny - oy);
        const far = Math.hypot(Math.max(Math.abs(e.x - h - ox), Math.abs(e.x + h - ox)), Math.max(Math.abs(e.y - h - oy), Math.abs(e.y + h - oy)));
        if (near <= r + 7 && far >= r - 7) { hurtEnemy(g, e, hitDamage(g) * T.shockDmg * g.shockPow * (1 + 0.25 * lv('shockamp')), 'shock'); if (!e.boss) e.x += 2.5 * SPD(); }
      }
      g.ebullets = g.ebullets.filter(eb => Math.hypot(eb.x - ox, eb.y - oy) > r + 6);
    }
    if (s.t <= 0) { s.st = 'cool'; s.t = T.shockCool; }
  } else if (s.st === 'cool') { s.t -= dt; if (s.t <= 0) s.st = 'idle'; }

  // --- bosses ---
  if (!g.boss && g.t >= g.nextBoss - 3 && !g.bossWarn) { g.bossWarn = 3; SFX.siren(); }
  if (g.bossWarn > 0) { g.bossWarn -= dt; if (g.bossWarn <= 0) { g.bossWarn = 0; spawnBoss(g); } }

  // --- spawner (his 0.5..1 s, gentler at the start, faster over time) ---
  g.spawnCd -= dt;
  if (g.spawnCd <= 0) {
    spawnEnemy(g);
    const dm = g.D <= 3 ? Math.pow(3 / g.D, 0.5) : 1 + T.hSpawn * hard(g);
    g.spawnCd = srand(0.5, 1.0) / ((T.rateStart + g.t / T.rampTime) * dm) / (g.boss || g.bossWarn ? 0.45 : 1);
  }

  // --- bullets --- (squares are put into 32-unit-wide x columns so each bullet only checks nearby ones)
  const GRID = 32, cols = new Map();
  const addToGrid = e => { const h = half(e), c0 = Math.floor((e.x - h) / GRID), c1 = Math.floor((e.x + h) / GRID); for (let c = c0; c <= c1; c++) { let a = cols.get(c); if (!a) cols.set(c, a = []); a.push(e); } };
  for (const e of g.enemies) if (!e.dead) addToGrid(e);
  let gridN = g.enemies.length;           // squares born mid-loop (splitter children) are added as they appear
  let qid = (g.qid = (g.qid || 0) + 1);
  for (const bl of g.bullets) {
    bl.px = bl.x; bl.life += dt;
    bl.x += bl.vx * dt; bl.y += bl.vy * dt;
    if (bl.x > WW / 2 + 30 || Math.abs(bl.y) > WH / 2 + 20) { bl.dead = true; continue; }
    const sc = bl.size / 100, hh = bl.kind === 'piercer' ? 3 : 5 * sc;
    const x0 = Math.min(bl.px, bl.x) + 4 * sc, x1 = bl.x + (bl.kind === 'piercer' ? 24 : 38 * sc);
    // enemy bullets can be shot down
    for (const eb of g.ebullets) if (!eb.dead && eb.x >= x0 - 4 && eb.x <= x1 + 4 && Math.abs(eb.y - bl.y) < hh + 4) {
      eb.dead = true; g.parts.push({ k: 'spark', x: eb.x, y: eb.y, vx: 0, vy: 0, life: 0.15, max: 0.15, col: '#ff8080' });
      if (bl.kind !== 'piercer') { bl.dead = true; break; }
    }
    if (bl.dead) continue;
    const hit = [];
    if (g.enemies.length > gridN) { for (let i = gridN; i < g.enemies.length; i++) addToGrid(g.enemies[i]); gridN = g.enemies.length; }
    qid++;
    for (let c = Math.floor(x0 / GRID), c1 = Math.floor(x1 / GRID); c <= c1; c++) {
      const list = cols.get(c); if (!list) continue;
      for (const e of list) {
        if (e._q === qid) continue; e._q = qid;
        if (e.dead || bl.hits.has(e) || phasedOut(e)) continue;
        const h = half(e);
        if (x1 >= e.x - h && x0 <= e.x + h && bl.y + hh >= e.y - h && bl.y - hh <= e.y + h) hit.push(e);
      }
    }
    hit.sort((a, b2) => a.x - b2.x);
    for (const e of hit) {
      bl.hits.add(e);
      const hx = Math.max(x0, e.x - half(e));
      if (bl.kind === 'piercer') {
        hurtEnemy(g, e, hitDamage(g) * 2.5 * (1 + 0.2 * lv('piercore')), 'pierce');
        if (g.chain) chainZap(g, e, hitDamage(g));
        if (bl.hits.size >= 5) unlock('kebab');
      } else {
        hurtEnemy(g, e, hitDamage(g), 'bullet');
        if (g.chain) chainZap(g, e, hitDamage(g));
        g.parts.push({ k: 'spark', x: hx, y: bl.y, vx: rnd(-120, -40), vy: rnd(-80, 80), life: 0.14, max: 0.14, col: '#bffcff' });
        if (g.splash > 0 || v.splash) {
          // the bullet clone turns into the splash costume, grows 1..20 and hurts what it touches
          g.explosions.push({ x: hx, y: bl.y, size: (bl.size + srand(1, 20)) * (g.variant === 2 ? 1 + 0.2 * lv('blast') : 1), t: 0.16, max: 0.16, done: false });
        }
        if (bl.pierceLeft <= 0) { bl.dead = true; break; }
        bl.pierceLeft--;
      }
    }
  }
  g.qid = qid;
  compact(g.bullets, b2 => !b2.dead);

  // --- splash explosions: one hit to everything inside ---
  for (const ex of g.explosions) {
    ex.t -= dt;
    if (!ex.done) {
      ex.done = true;
      const r = 22 * ex.size / 100 * 1.3, cxx = ex.x + 10 * ex.size / 100;
      for (const e of g.enemies) {
        if (e.dead) continue;
        const h = half(e);
        const nx = clamp(cxx, e.x - h, e.x + h), ny = clamp(ex.y, e.y - h, e.y + h);
        if ((nx - cxx) ** 2 + (ny - ex.y) ** 2 <= r * r) hurtEnemy(g, e, hitDamage(g), 'splash');
      }
    }
  }
  g.explosions = g.explosions.filter(e => e.t > 0);

  // --- enemies ---
  const edt = dt * g.slow;      // Time Warp slows the squares, not you
  for (const e of g.enemies) {
    if (e.dead) continue;
    e.t += edt; e.flash -= dt; e.phase += edt;
    if (e.type === 'healer') {
      e.healCd -= edt;
      if (e.healCd <= 0) {
        e.healCd = 3;
        g.rings.push({ x: e.x, y: e.y, r: 6, vr: 200, life: 0.35, max: 0.35, col: '#35ff00', lw: 3 });
        for (const o of g.enemies) if (o !== e && !o.dead && !o.boss && Math.hypot(o.x - e.x, o.y - e.y) < 75) { o.size = Math.min(o.max, o.size + o.max * 0.15); o.healed = 0.4; }
      }
    }
    if (e.healed) e.healed = Math.max(0, e.healed - dt);
    if (e.boss) updateBoss(g, e, edt);
    else if (e.type === 'shooter') updateShooter(g, e, edt);
    else {
      if (e.type === 'swarm') e.vy += Math.sin(e.t * 4 + e.wob) * 60 * edt;
      e.x -= e.speed * edt;
      e.y = clamp(e.y + e.vy * dt, -168, 168); e.vy *= Math.pow(0.2, dt);
      if (e.type === 'dasher') e.rot = Math.sin(e.t * 9) * 0.06;
    }
    const lane = laneX();
    if (e.boss ? e.x - half(e) * 0.8 < lane : e.x < lane) {
      e.dead = true;
      const col = enemyColor(e);
      if (e.boss) { hurtCannon(g, 45, lane, e.y); burst(g, lane + 10, e.y, col, 40, 2, true); g.boss = null; g.nextBoss = g.t + bossGap(g); setMusic('game'); }
      else hurtCannon(g, Math.ceil(e.size / T.leakDiv * (ETYPES[e.type].leak || 1) * (1 + T.hLeak * hard(g))), lane, e.y);
      for (let i = 0; i < 14; i++) { const a = rnd(-1.2, 1.2), sp = rnd(40, 160); g.parts.push({ k: 'shard', x: lane, y: e.y + rnd(-8, 8), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: 0, vr: rnd(-10, 10), sz: rnd(2, 5), life: rnd(0.3, 0.6), max: 0.6, col }); }
      g.wallHit = { y: e.y, t: 0.5 };
    }
  }

  separate(g, dt);

  // --- enemy bullets ---
  for (const eb of g.ebullets) {
    eb.x += eb.vx * dt; eb.y += eb.vy * dt; eb.t += dt;
    if (eb.x < cx + 16 && eb.x > cx - 16 && Math.abs(eb.y - g.y) < 13) { eb.dead = true; hurtCannon(g, 6 * (1 + T.hLeak * hard(g) * 0.5), eb.x, eb.y); }
    if (eb.x < -WW / 2 - 20 || Math.abs(eb.y) > WH / 2 + 20) eb.dead = true;
  }
  g.ebullets = g.ebullets.filter(e => !e.dead);

  // --- gold coins: drift left, the magnet pulls them in ---
  for (const c of g.coins) {
    c.t += dt;
    const dx = cx - c.x, dy = g.y - c.y, d = Math.hypot(dx, dy) || 0.001;
    if (d < coinRange() || c.pull) { c.pull = true; c.vx = lerp(c.vx, dx / d * 260, 1 - Math.pow(0.001, dt)); c.vy = lerp(c.vy, dy / d * 260, 1 - Math.pow(0.001, dt)); }
    else { c.vx = lerp(c.vx, -35 * SPD(), 1 - Math.pow(0.3, dt)); c.vy *= Math.pow(0.3, dt); }
    c.x += c.vx * dt; c.y = clamp(c.y + c.vy * dt, -145, 140);
    if (d < 12) { c.dead = true; g.gold += c.val * g.goldMul; g.coinsGot++; SFX.coin(); g.popups.push({ x: cx + 20, y: g.y + 10, val: Math.floor(c.val * g.goldMul) || 1, t: 0.6, col: '#ffd43b', gold: true }); if (g.coinsGot >= 50) unlock('coin50'); }
    else if (c.x < cx - 14 || c.t > 14) c.dead = true;
  }
  g.coins = g.coins.filter(c => !c.dead);

  // --- endless waves: a new wave every 30 s, a milestone every 5 waves ---
  const wave = 1 + Math.floor(g.t / 30);
  if (wave > g.wave) {
    g.wave = wave; g.waveBanner = 2;
    if (wave % 5 === 0) {
      g.milestone = 3; g.gold += 10 * wave * g.goldMul; giveCard(g, false, 1); SFX.milestone();
      g.popups.push({ x: 0, y: 40, val: 'MILESTONE  +' + Math.floor(10 * wave * g.goldMul) + ' GOLD', t: 1.6, col: '#ffd43b' });
    } else SFX.wave();
    if (wave >= 10) unlock('wave10');
    if (wave >= 20) unlock('wave20');
  }
  if (g.daily && g.t >= 60) unlock('daily');

  // --- low health alarm ---
  if (g.health < g.startHealth * 0.3) { g.beepT -= dt; if (g.beepT <= 0) { SFX.alarm(); g.beepT = 0.9; } }

  // --- achievements over time ---
  if (g.t >= 300) unlock('surv5');
  if (g.t >= 600) unlock('surv10');
  if (g.t >= 120 && g.damageTaken === 0) unlock('untouch');
  if (g.D >= 7 && g.t >= 60) unlock('brave');
  if (g.D === 10 && g.t >= 120) unlock('impossible');

  if (g.health <= 0 && g.revives > 0) {
    // Emergency Revive: back up, blast everything nearby away
    g.revives--; g.revived = 1;
    g.health = Math.round(g.startHealth * (lv('revive') >= 2 ? 0.6 : 0.35));
    g.ebullets = []; g.flash = 0.7; g.freeze = 0.3; addTrauma(g, 1);
    for (const e of g.enemies) if (!e.boss && e.x < cx + 200) e.x += 120;
    g.rings.push({ x: cx, y: g.y, r: 10, vr: 500, life: 0.6, max: 0.6, col: '#ff4d5e', lw: 8 });
    g.popups.push({ x: cx + 60, y: g.y + 20, val: 'REVIVED!', t: 1.5, col: '#ff8a95' });
    SFX.revive(); unlock('revived');
  }
  if (g.health <= 0) {
    g.health = 0; g.dead = 0.0001; g.trauma = 1; g.flash = 0.6;
    burst(g, cx, g.y, '#00fffa', 50, 2, true);
    burst(g, cx, g.y, '#8a96a8', 40, 1.5, true);
    SFX.gameOver(); setMusic('off');
    endRun(g);
  }
  stepFx(g, dt);
}

function separate(g, dt) {
  const list = g.enemies.filter(e => !e.boss).sort((a, b) => a.x - b.x);
  const k = Math.min(1, dt * 10);
  let maxH = 0; for (const e of list) maxH = Math.max(maxH, half(e));
  for (let i = 0; i < list.length; i++) {
    const a = list[i], ha = half(a);
    for (let j = i + 1; j < list.length; j++) {
      const b = list[j], hb = half(b), lim = ha + hb + 1;
      const dx = b.x - a.x, dy = b.y - a.y;
      if (dx >= ha + maxH + 1) break;                 // sorted by x: nothing further right can touch a
      if (Math.abs(dx) >= lim || Math.abs(dy) >= lim) continue;
      // push apart vertically (they all fly left, so sideways is the natural way out); bigger squares move less
      const over = lim - Math.abs(dy), dir = dy === 0 ? (i % 2 ? 1 : -1) : Math.sign(dy);
      const wa = hb / (ha + hb), wb = ha / (ha + hb);
      a.y = clamp(a.y - dir * over * wa * k, -168, 168);
      b.y = clamp(b.y + dir * over * wb * k, -168, 168);
      // if they are pinned against the top or bottom edge, separate them along x instead
      if (Math.abs(a.y) >= 168 || Math.abs(b.y) >= 168) { const ox = (lim - Math.abs(dx)) * k * 0.5, sx = dx === 0 ? 1 : Math.sign(dx); a.x -= sx * ox * wa; b.x += sx * ox * wb; }
    }
  }
}
function updateShooter(g, e, dt) {
  if (e.state === 'advance') {
    e.x -= e.speed * dt;
    if (!e.done && e.x <= e.stopX) { e.state = 'hold'; e.hold = 10; }
  } else {
    e.hold -= dt;
    e.y += clamp(g.y - e.y, -1, 1) * 22 * dt;
    e.fireCd -= dt;
    if (e.fireCd <= 0) { e.fireCd = 2.2 / (1 + T.hFire * hard(g)); enemyShoot(g, e, 0); }
    if (e.hold <= 0) { e.state = 'advance'; e.done = true; }
  }
}
function enemyShoot(g, e, angleOff) {
  const sx = e.x - half(e) - 6, sy = e.y;
  const a = Math.atan2(g.y - sy, cannonX() - sx) + angleOff;
  const sp = 115 * SPD();
  g.ebullets.push({ x: sx, y: sy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0 });
  g.parts.push({ k: 'spark', x: sx, y: sy, vx: -60, vy: 0, life: 0.15, max: 0.15, col: '#ff6060' });
  SFX.eshot();
}
function updateBoss(g, e, dt) {
  const k = e.boss.kind, holdX = WW / 2 - 130 * SPD();
  e.rot = Math.sin(e.t * 1.3) * 0.03;
  if (k === 'mega') {
    e.x -= (e.x > holdX ? 40 * SPD() : e.speed) * dt;
    e.y = Math.sin(e.t * 0.5) * 40;
    e.spawnCd -= dt;
    if (e.spawnCd <= 0 && e.x < WW / 2) {
      e.spawnCd = 3.2;
      for (const s of [-1, 1]) { const c = makeEnemy(g, 'square', e.x - half(e) * 0.7, e.y + s * half(e) * 0.6, srand(85, 115) * growth(g.t)); c.vy = s * 40; }
    }
  } else if (k === 'blaster') {
    if (e.x > holdX) e.x -= 40 * SPD() * dt;
    else {
      e.holdT += dt;
      e.y = Math.sin(e.holdT * 0.6) * 110;
      if (e.holdT > 50) e.x -= 6 * SPD() * dt;
      e.fireCd -= dt;
      if (e.fireCd <= 0) { e.fireCd = 1.7 / (1 + T.hFire * hard(g)); for (const a of [-0.2, 0, 0.2]) enemyShoot(g, e, a); }
    }
  } else if (k === 'hive') {
    if (e.x > holdX) e.x -= 40 * SPD() * dt;
    else {
      e.holdT += dt;
      e.y = Math.sin(e.holdT * 0.4) * 80;
      if (e.holdT > 60) e.x -= 6 * SPD() * dt;
      e.size = Math.min(e.max, e.size + e.max * 0.008 * dt);        // slowly heals itself
      e.spawnCd -= dt;
      if (e.spawnCd <= 0) {
        e.spawnCd = 2.6 / (1 + T.hFire * hard(g));
        for (let i = 0; i < 3; i++) { const c = makeEnemy(g, 'swarm', e.x - half(e) * 0.8, e.y + (i - 1) * 14, 60 * growth(g.t)); c.vy = (i - 1) * 50; }
      }
    }
  } else if (k === 'phantom') {
    if (e.x > holdX) e.x -= 40 * SPD() * dt;
    else {
      e.holdT += dt;
      e.x -= 5 * SPD() * dt;
      e.phased = Math.max(0, e.phased - dt);
      e.tele -= dt;
      if (e.tele <= 0.6 && !e.teleTo && e.tele > 0) { e.teleTo = rnd(-120, 120); e.phased = 0.6; }
      if (e.tele <= 0) {
        e.y = e.teleTo || 0; e.teleTo = 0; e.tele = 3.5 / (1 + T.hFire * hard(g) * 0.5);
        g.rings.push({ x: e.x, y: e.y, r: 10, vr: 260, life: 0.4, max: 0.4, col: '#ef00ff', lw: 5 });
        for (const a of [-0.5, -0.25, 0, 0.25, 0.5]) enemyShoot(g, e, a);
      }
    }
  } else {
    e.x -= (e.x > holdX ? 40 * SPD() : 9 * SPD()) * dt;
    e.y = Math.sin(e.t * 0.8) * 70;
  }
}

// remove dead items in place (no new array every frame); dead particles go back to a pool for reuse
const POOL = [];
function compact(arr, alive, pool) {
  let j = 0;
  for (let i = 0; i < arr.length; i++) { const o = arr[i]; if (alive(o)) arr[j++] = o; else if (pool && pool.length < 800) pool.push(o); }
  arr.length = j;
}
function newPart(o) { const p = POOL.pop() || {}; for (const k in p) delete p[k]; return Object.assign(p, o); }
function stepFx(g, dt) {
  const cap = CAP();
  if (g.parts.length > cap.parts) g.parts.splice(0, g.parts.length - cap.parts);
  if (g.popups.length > cap.popups) for (const p of g.popups.splice(0, g.popups.length - cap.popups)) p.t = 0;   // t = 0 so a square holding it starts a fresh one
  for (const p of g.parts) {
    p.life -= dt;
    if (p.k === 'suck') { const k = 1 - p.life / p.max; p.x = lerp(p.x, p.tx, k * 0.3); p.y = lerp(p.y, p.ty, k * 0.3); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    const drag = Math.pow(0.08, dt); p.vx *= drag; p.vy *= drag;
    if (p.rot !== undefined) p.rot += p.vr * dt;
  }
  compact(g.parts, p => p.life > 0, POOL);
  for (const r of g.rings) { r.life -= dt; r.r += r.vr * dt; }
  compact(g.rings, r => r.life > 0);
  if (g.rings.length > 80) g.rings.splice(0, g.rings.length - 80);
  for (const p of g.popups) { p.y += 24 * dt; p.t -= dt; }
  compact(g.popups, p => p.t > 0);
  for (const c of g.cards) c.t += dt;
  g.cards = g.cards.filter(c => c.t < 1.45);
  g.trauma = Math.max(0, g.trauma - dt * 1.6);
  g.hurt = Math.max(0, g.hurt - dt);
  g.flash = Math.max(0, g.flash - dt);
  g.bossBanner = Math.max(0, g.bossBanner - dt);
  g.waveBanner = Math.max(0, (g.waveBanner || 0) - dt);
  g.xpFull = Math.max(0, (g.xpFull || 0) - dt);
  if (g.bossFade) g.bossFade.t -= dt;
  g.milestone = Math.max(0, (g.milestone || 0) - dt);
  if (g.wallHit) { g.wallHit.t -= dt; if (g.wallHit.t <= 0) g.wallHit = null; }
  g.shownHealth = lerp(g.shownHealth, g.health, 1 - Math.pow(0.02, dt));
}

// credits per gold: Baby mode pays little, hard modes pay a lot
function creditMul(D) { return D === 1 ? 0.25 : D === 2 ? 0.6 : 1 + (D - 3) * 0.5; }

function endRun(g) {
  const gold = Math.floor(g.gold);
  const credits = Math.floor(gold * creditMul(g.D) * (g.daily ? 2 : 1));
  const prevBest = g.daily ? 0 : (SAVE.best[g.D] || 0);
  if (!g.daily && g.wave > (SAVE.bestWave[g.D] || 0)) SAVE.bestWave[g.D] = g.wave;
  if (g.daily) { const k = todayKey(); if (SAVE.daily.date !== k) SAVE.daily = { date: k, best: 0 }; SAVE.daily.best = Math.max(SAVE.daily.best, gold); }
  SAVE.credits += credits;
  SAVE.stats.creditsEarned += credits;
  SAVE.stats.runs++; SAVE.stats.time += g.t;
  if (!g.daily && gold > prevBest) SAVE.best[g.D] = gold;
  if (SAVE.stats.creditsEarned >= 10000) unlock('rich');
  writeSave();
  runResult = { gold, credits, newBest: !g.daily && gold > prevBest && gold > 0, prevBest, ach: g.newAch.slice() };
}

function unlock(id) {
  if (SAVE.ach[id]) return;
  const a = ACHS.find(x => x.id === id); if (!a) return;
  SAVE.ach[id] = Date.now();
  SAVE.credits += a.reward;
  if (G) G.newAch.push(a);
  ui.toasts.push({ a, t: 0 });
  SFX.ach();
  writeSave();
}
function checkShopAch() {
  if ([1, 2, 3, 4].every(v => SAVE.owned[v])) unlock('collect');
  if (SHOP.every(it => lv(it.id) >= it.max)) unlock('maxed');
}

function go(fn) { if (trans) return; trans = { t: 0, fn, done: false }; }
function stepTrans(dt) {
  if (!trans) return;
  trans.t += dt;
  if (!trans.done && trans.t >= 0.22) { trans.done = true; trans.fn(); }
  if (trans.t >= 0.5) trans = null;
}

function shopAct(en) {
  if (en.kind === 'up') {
    if (en.it.needs && !SAVE.owned[en.it.needs]) { SFX.deny(); ui.denyT = 0.4; return; }
    const l = lv(en.it.id);
    if (l >= en.it.max) { SFX.deny(); return; }
    const c = shopCost(en.it, l);
    if (SAVE.credits < c) { SFX.deny(); ui.denyT = 0.4; return; }
    SAVE.credits -= c; SAVE.shop[en.it.id] = l + 1; SFX.buy();
  } else {
    if (SAVE.owned[en.v]) { SAVE.variant = en.v; SFX.click(); }
    else {
      const c = VARIANTS[en.v].cost;
      if (SAVE.credits < c) { SFX.deny(); ui.denyT = 0.4; return; }
      SAVE.credits -= c; SAVE.owned[en.v] = true; SAVE.variant = en.v; SFX.buy();
    }
  }
  checkShopAch();
  writeSave();
}

function onKeyDown(k) {

    else if (k === 'arrowdown' || k === 's') { ui.sel = (ui.sel + 1) % menu.length; SFX.hover(); }

  else if (scene === 'play' || scene === 'over') {
    drawWorld(G); drawHud(G);
    if (paused || scene === 'over') drawPauseOrOver();
  }
  drawToasts();
  drawTransition();
  drawFps();
  ui.mouseMoved = false;
}

// ---------------------------------------------------------------------
//  boot
// ---------------------------------------------------------------------
function setTimeoutSafe(fn, ms) { if (typeof setTimeout === 'function') setTimeout(fn, ms); }
function resize() {
  DPR = Math.min(Q.low ? 1 : 1.5, window.devicePixelRatio || 1);    // capped: 2x sharpness costs ~1.8x the pixels for little visible gain
  VW = window.innerWidth || 960; VH = window.innerHeight || 720;
  K = Math.min(VH / 360, VW / 480);
  WW = clamp(VW / K, 480, 960); WH = VH / K;
  if (cv) { cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR); }
  if (ctx) { ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; }
}
function setQuality(low) { if (Q.low === low) return; Q.low = low; resize(); }
// called once per real frame with the frame time; drops to low quality if it stays slow (auto mode only)
function trackFps(ms) {
  if (!(ms > 0) || ms > 1000) return;           // first frame / tab switch: not a real frame time
  Q.ema = lerp(Q.ema, Math.min(ms, 100), 0.05); Q.fps = 1000 / Q.ema;
  if (SAVE.quality !== 'auto' || Q.low) return;
  if (scene === 'play' && !paused && Q.ema > 24) Q.slowT += ms / 1000; else Q.slowT = Math.max(0, Q.slowT - ms / 2000);
  if (Q.slowT > 3) { setQuality(true); Q.note = 4; }
}
function drawFps() {
  setScreen();
  if (Q.note > 0) { Q.note -= 1 / 60; txt('Low quality mode on so it runs smoothly (change it in QUALITY)', VW / 2, VH - 60, 12, `rgba(207,227,245,${clamp(Q.note, 0, 1)})`, { al: 'center', f: F2, w: 700 }); }
  if (!Q.show) return;
  const g = G, items = g ? ` · ${g.enemies.length} sq · ${g.bullets.length} b · ${g.parts.length} fx` : '';
  rr(ctx, 6, 6, 300, 22, 5); ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fill();
  txt(`${Math.round(Q.fps)} FPS · ${Q.ema.toFixed(1)} ms · ${Q.low ? 'LOW' : 'HIGH'} · ${cv ? cv.width + 'x' + cv.height : ''}${items}`, 12, 17, 10, Q.fps < 45 ? '#ff8a95' : '#35ff00', { f: F2, w: 700 });
}
function onMouse(ev) {
  const r = cv.getBoundingClientRect();
  mouse.x = ev.clientX - r.left; mouse.y = ev.clientY - r.top;
  mouse.wx = (mouse.x - VW / 2) / K; mouse.wy = -(mouse.y - VH / 2) / K;
}
function boot() {
  cv = document.getElementById('c');
  ctx = cv.getContext('2d');
  loadSave();
  makeNebula(); makeStars();
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('keydown', ev => {
    const k = ev.key.toLowerCase();
    if (k === 'f3') { ev.preventDefault(); Q.show = !Q.show; return; }
    if (!keys[k]) onKeyDown(k);
    keys[k] = true;
    if (k === ' ' || k.startsWith('arrow')) ev.preventDefault();
  });
  window.addEventListener('keyup', ev => { keys[ev.key.toLowerCase()] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (scene === 'play' && !paused && G && !G.dead) { paused = true; ui.sel = 0; setMusic('pause'); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { for (const k in keys) keys[k] = false; if (scene === 'play' && !paused && G && !G.dead) { paused = true; ui.sel = 0; setMusic('pause'); } } });
  cv.addEventListener('mousemove', ev => { onMouse(ev); ui.mouseMoved = true; });
  cv.addEventListener('mousedown', ev => { onMouse(ev); onClick(); });
  cv.focus();
  setMusic('title');
  let last = performance.now(), acc = 0;
  const STEP = 1 / 60;
  function frame(now) {
    trackFps(now - last);
    acc += clamp((now - last) / 1000, 0, 0.1); last = now;
    while (acc >= STEP) { step(STEP); acc -= STEP; }
    musicUpdate();
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// hooks for headless testing
window.SG = { CAPS, Q, setQuality, SHOP, CARDS, BOSSES, giveCard, step, newGame, keys, mouse, onClick, onKeyDown, draw, beamHits, hitDamage, killSize, T, VARIANTS,
  get G() { return G; }, get scene() { return scene; }, set scene(v) { scene = v; }, SAVE: () => SAVE, ui, loadSave, resize,
  boot: () => { loadSave(); makeNebula(); makeStars(); resize(); } };
if (!window.SG_HEADLESS) boot();
</script>
